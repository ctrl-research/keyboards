<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Design docs for jonathan's keyboard projects.">
<title>keyboards</title>
<style>
  :root {
    --bg: #f5f3ee; --ink: #26241f; --muted: #6e6a5f; --border: #e0dcd2; --accent: #c05a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171b; --ink: #e6e3da; --muted: #9a968a; --border: #33353c; --accent: #e07a4a; }
  }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 4rem 1.25rem;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.5rem; letter-spacing: 0.2em; text-transform: uppercase;
    font-weight: 600; margin: 0 0 0.25rem;
  }
  .sub { color: var(--muted); margin: 0 0 2.5rem; }
  a.project {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 1.1rem 1.35rem; margin-bottom: 1rem;
  }
  a.project:hover { border-color: var(--accent); }
  a.project:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .name {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .desc { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
</style>
</head>
<body>
<main>
  <h1>Keyboards</h1>
  <p class="sub">Design docs for my keyboard projects.</p>
  <a class="project" href="gemini/">
    <div class="name">Gemini</div>
    <div class="desc">A split staggered 40% whose halves dock back into a regular 40%. Rev A layout spec.</div>
  </a>
</main>
</body>
</html>
